name: Deploy pygbag to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v5      # 👈 Actualizado

      - name: Setup Python
        uses: actions/setup-python@v6  # 👈 Actualizado
        with:
          python-version: "3.12"

      - name: Instalar pygbag
        run: |
          python -m pip install --upgrade pip
          pip install pygbag

      - name: Compilar juego con pygbag
        run: |
          pygbag --build .

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto (build/web)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
